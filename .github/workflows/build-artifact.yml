name: Build IPA artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout fixed source
        uses: actions/checkout@v7
        with:
          ref: 36110fd7544ceefdc419e13d337ec515e3ec53dc
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and verify IPA
        id: build
        run: |
          mkdir -p "$HOME/.local/state/agents/tmp/gestaltx-build"
          export TMPDIR="$HOME/.local/state/agents/tmp/gestaltx-build"
          .github/scripts/build-ipa.sh "$RUNNER_TEMP/ipa"
          shasum -a 256 "$RUNNER_TEMP/ipa/"*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GestaltX-36110fd-ipa
          path: ${{ steps.build.outputs.ipa }}
          if-no-files-found: error
          retention-days: 7
